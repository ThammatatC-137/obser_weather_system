services:
  mongodb:
    image: mongo:7
    container_name: observatory-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: observatory-web
    ports:
      - "3001:3001"
    env_file:
      - .env.local
    depends_on:
      - mongodb
    restart: unless-stopped

  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    container_name: observatory-collector
    env_file:
      - .env.local
    depends_on:
      - mongodb
    restart: unless-stopped

  predict:
    build:
      context: .
      dockerfile: Dockerfile.predict
    container_name: observatory-predict
    env_file:
      - .env.local
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongodb_data:
