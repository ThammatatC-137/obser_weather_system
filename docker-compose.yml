version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: observatory-web
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    restart: unless-stopped

  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    container_name: observatory-collector
    env_file:
      - .env.local
    restart: unless-stopped
