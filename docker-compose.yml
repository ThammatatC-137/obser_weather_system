services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: observatory-web
    ports:
      - "3001:3001"
    env_file:
      - .env.local
    restart: unless-stopped

  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    container_name: observatory-collector
    env_file:
      - .env.local
    restart: unless-stopped

  predict:
    build:
      context: .
      dockerfile: Dockerfile.predict
    container_name: observatory-predict
    env_file:
      - .env.local
    restart: unless-stopped
